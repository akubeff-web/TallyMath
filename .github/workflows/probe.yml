name: Probe runners

# Диагностика: какие раннеры доступны и какие версии Xcode на них стоят.
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          uname -a
          if [ "$(uname)" = "Darwin" ]; then sw_vers; ls -d /Applications/Xcode*.app || true; xcrun simctl list runtimes || true; fi
