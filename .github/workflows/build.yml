name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Новый коммит отменяет устаревшую сборку той же ветки: macOS-раннеров мало.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Использую $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Тесты MathCore
        working-directory: Packages/MathCore
        run: swift test

      - name: Проверить Swift-сниппеты
        run: python3 scripts/check_snippets.py

      - name: Выбрать симулятор
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Тесты приложения на симуляторе
        run: |
          set -o pipefail
          xcodebuild test \
            -project TallyMath.xcodeproj -scheme TallyMath \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|warning: |Test |passed|failed|BUILD" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Скриншоты
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim/Build/Products/Debug-iphonesimulator/TallyMath.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Неподписанная сборка
        run: |
          set -o pipefail
          xcodebuild -project TallyMath.xcodeproj -scheme TallyMath \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E "error:|BUILD" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TallyMath.app Payload/
          zip -qry TallyMath.ipa Payload
          ls -lh TallyMath.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TallyMath-ipa
          path: TallyMath.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TallyMath.ipa
