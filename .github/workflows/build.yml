name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (например v0.1.0). Пусто — без релиза."
        required: false
        default: ""

permissions:
  contents: write

# Новый коммит отменяет устаревшую сборку той же ветки: macOS-раннеров мало.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 этому аккаунту не выдаётся (задачи висят в очереди), а xcode-27 стартует сразу.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Xcode 26 по заданию; на раннере xcode-27 его нет — тогда 27.1 (стабильный), иначе самый новый.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode_27.1.app ]; then XCODE=/Applications/Xcode_27.1.app; fi
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1); fi
          echo "Использую $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Тесты MathCore
        working-directory: Packages/MathCore
        run: swift test

      - name: Проверить Swift-сниппеты
        run: python3 scripts/check_snippets.py

      - name: Выбрать симулятор
        id: sim
        run: |
          UDID=$(python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Тесты приложения на симуляторе
        run: |
          set -o pipefail
          xcodebuild test \
            -project TallyMath.xcodeproj -scheme TallyMath \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|warning: |Test |passed|failed|BUILD" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Неподписанная сборка
        run: |
          set -o pipefail
          xcodebuild -project TallyMath.xcodeproj -scheme TallyMath \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E "error:|BUILD" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TallyMath.app Payload/
          zip -qry TallyMath.ipa Payload
          ls -lh TallyMath.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TallyMath-ipa
          path: TallyMath.ipa

      # Release: при пуше тега v* или при ручном запуске с полем release_tag (тег создастся сам).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: TallyMath ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: TallyMath.ipa

      # Скриншоты — последними и не роняют сборку: главное — .ipa.
      - name: Скриншоты
        continue-on-error: true
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim/Build/Products/Debug-iphonesimulator/TallyMath.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
